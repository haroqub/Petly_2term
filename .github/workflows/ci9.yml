name: .NET CI + Deploy

on:
  push:
    branches:
      - "*"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore AppCode/Petly/Petly.csproj

    - name: Build
      run: dotnet build AppCode/Petly/Petly.csproj --configuration Release --no-restore

    - name: Test
      run: dotnet test AppCode/Petly.Tests/Petly.Tests.csproj

    - name: Publish
      run: dotnet publish AppCode/Petly/Petly.csproj -c Release -o ./publish --self-contained false

    - name: Zip publish folder
      run: |
        cd publish
        zip -r ../app.zip .

    - name: Deploy to Azure
      uses: azure/webapps-deploy@v2
      with:
        app-name: petly9
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: app.zip
